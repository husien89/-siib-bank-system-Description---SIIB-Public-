<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <!-- الشريط العلوي — الأخضر -->
  <rect x="0" y="0" width="300" height="60" fill="#007A3D" />
  
  <!-- الشريط الأوسط — الأبيض -->
  <rect x="0" y="60" width="300" height="60" fill="#FFFFFF" />
  
  <!-- الشريط السفلي — الأسود -->
  <rect x="0" y="120" width="300" height="60" fill="#000000" />
  
  <!-- النجمة الأولى الحمراء -->
  <polygon points="85,90 95,65 105,90 130,90 110,105 120,130 95,115 70,130 80,105 60,90" fill="#CE1126" />
  
  <!-- النجمة الثانية الحمراء -->
  <polygon points="150,90 160,65 170,90 195,90 175,105 185,130 160,115 135,130 145,105 125,90" fill="#CE1126" />
  
  <!-- النجمة الثالثة الحمراء -->
  <polygon points="215,90 225,65 235,90 260,90 240,105 250,130 225,115 200,130 210,105 190,90" fill="#CE1126" />
</svg>
