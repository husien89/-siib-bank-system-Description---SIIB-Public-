<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك سورية الدولي الإسلامي — تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f3460 0%, #16537e 50%, #1a5f7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #0d2137 0%, #153b50 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        .logo-area { margin-bottom: 15px; }
        .logo-img { width: 85px; height: auto; }
        .flag-area { margin-top: 10px; }
        .flag-img { width: 140px; height: auto; border-radius: 4px; }
        .bank-name { font-size: 20px; font-weight: bold; margin: 10px 0 5px; }
        .bank-en { font-size: 12px; opacity: 0.8; }
        .card-body { padding: 30px 25px; }
        .form-title { text-align: center; color: #0f3460; font-size: 18px; margin-bottom: 25px; font-weight: 600; }
        .input-group { margin-bottom: 18px; }
        label { display: block; color: #0f3460; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #d0d7e0;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: #0f3460; background: #fafcff; }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f3460, #16537e);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,52,96,0.3); }
        .error-msg {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .hologram {
            background: linear-gradient(90deg, #ffd700, #c0c0c0, #ffd700, #c0c0c0);
            background-size: 300% 100%;
            animation: holoShine 3s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        @keyframes holoShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .qrcode-area { text-align: center; margin-top: 20px; }
        .qrcode-box {
            width: 70px;
            height: 70px;
            background: #f0f4f8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 10px;
            color: #0f3460;
            border: 1px dashed #0f3460;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <div class="logo-area">
                <img src="logo.png" alt="شعار بنك سورية الدولي الإسلامي" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="bank-name hologram">بنك سورية الدولي الإسلامي</div>
            <div class="bank-en">Syria International Islamic Bank — SIIB</div>
            <div class="flag-area" style="margin-top:12px;">
                <img src="flag.png" alt="علم الجمهورية العربية السورية" class="flag-img" onerror="this.style.display='none'">
            </div>
        </div>
        <div class="card-body">
            <h2 class="form-title">🔐 تسجيل الدخول إلى النظام الآمن</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>
            <button class="login-btn" onclick="doLogin()">✅ تسجيل الدخول</button>
            <div class="error-msg" id="errorBox">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
            <div class="qrcode-area">
                <div class="qrcode-box">
                    QR<br>Verify
                </div>
                <small style="color:#666; font-size:11px;">رمز التحقق الإلكتروني — SIIB-VERIFY-2026</small>
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (user === 'siib.sy' && pass === 'SIIB2024') {
                window.location.href = 'login.html';
            } else {
                document.getElementById('errorBox').style.display = 'block';
            }
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
