<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك سورية الدولي الإسلامي - SIIB Bank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f3460 0%, #16537e 50%, #1a5f7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #0d2137 0%, #153b50 100%);
            padding: 40px 25px;
            text-align: center;
            color: white;
        }
        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            width: 50px;
            height: 50px;
        }
        .card-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .card-header p {
            font-size: 15px;
            opacity: 0.8;
            line-height: 1.7;
        }
        .card-body {
            padding: 35px 25px;
        }
        .card-body h2 {
            text-align: center;
            color: #0f3460;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #0f3460;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 15px;
            text-align: right;
            transition: all 0.3s ease;
            background: #fcfcfc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #16537e;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(22, 83, 126, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f3460, #16537e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 52, 96, 0.3);
        }
        .error-msg {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <div class="logo-container">
                <!-- استخدام رابط مباشر للشعار لضمان الظهور الفوري -->
                <img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" alt="شعار البنك">
            </div>
            <h1>SIIB Bank</h1>
            <p>نظام مصرفي متكامل<br>إدارة حسابات العملاء<br>بأعلى معايير الأمان</p>
        </div>
        <div class="card-body">
            <h2>مرحباً بك</h2>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn-login">تسجيل الدخول</button>
                <p class="error-msg" id="errorMsg">اسم المستخدم أو كلمة المرور غير صحيحة</p>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if (user === 'siib.sy' && pass === 'SIIB2024') {
                window.location.href = 'login.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
