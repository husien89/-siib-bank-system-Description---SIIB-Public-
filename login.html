<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - SIIB</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <style>
        body {
            font-family: 'Tahoma';
            background: linear-gradient(135deg, #1B5E20, #0d3d13);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 380px;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: #1B5E20;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            font-size: 32px;
            font-weight: bold;
            border: 3px solid #D4AF37;
        }
        h1 { color: #1B5E20; font-size: 22px; }
        h2 { color: #666; font-size: 14px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1B5E20;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #0d3d13; }
        .error { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">SIIB</div>
        <h1>البنك الإسلامي السوري</h1>
        <h2>نظام الإشعارات المصرفية</h2>
        <form onsubmit="return doLogin(event)">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
            <div class="error" id="error">بيانات خاطئة!</div>
        </form>
    </div>
    <script>
        function doLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'siib.sy' && pass === 'SIIB2024') {
                localStorage.setItem('siib_logged', '1');
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
