<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- خلفية دائرية ذهبية متدرجة -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#F5C800" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3460" />
      <stop offset="100%" stop-color="#16537E" />
    </linearGradient>
  </defs>
  
  <!-- دائرة خارجية -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- تصميم مركزي هندسي إسلامي -->
  <path d="M100 30 L120 70 L165 75 L130 105 L140 150 L100 125 L60 150 L70 105 L35 75 L80 70 Z" 
        fill="url(#goldGrad)" stroke="#fff" stroke-width="2" />
  
  <!-- دائرة داخلية -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- اسم البنك اختصار -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="22" font-weight="bold" 
        fill="url(#goldGrad)" text-anchor="middle">SIIB</text>
</svg>
