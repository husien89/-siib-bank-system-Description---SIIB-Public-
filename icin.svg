<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d13;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" stroke="#D4AF37" stroke-width="5"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Islamic Pattern - Top -->
  <path d="M100 30 L115 60 L100 50 L85 60 Z" fill="#D4AF37"/>
  
  <!-- Bank Text -->
  <text x="100" y="90" text-anchor="middle" fill="#D4AF37" font-family="Arial" font-size="36" font-weight="bold">SIIB</text>
  
  <!-- Horizontal Line -->
  <line x1="50" y1="105" x2="150" y2="105" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Arabic Text -->
  <text x="100" y="125" text-anchor="middle" fill="#D4AF37" font-family="Arial" font-size="12">البنك الإسلامي</text>
  <text x="100" y="142" text-anchor="middle" fill="#D4AF37" font-family="Arial" font-size="11">السوري</text>
  
  <!-- Bottom Decoration -->
  <circle cx="100" cy="160" r="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="100" cy="160" r="3" fill="#D4AF37"/>
</svg>
